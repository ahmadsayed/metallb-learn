<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" font-family="Arial, Helvetica, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <text x="40" y="24" font-size="19" font-weight="bold" fill="#0f172a">MetalLB: who decides the IP, and who makes the network believe it</text>

  <!-- Service -->
  <rect x="40" y="44" width="340" height="86" rx="12" fill="#eef4ff" stroke="#3b82f6" stroke-width="2.5"/>
  <text x="60" y="74" font-size="15" font-weight="bold" fill="#1e3a8a">Service (type: LoadBalancer)</text>
  <text x="60" y="97" font-size="12.5" fill="#334155">spec.ports, spec.selector</text>
  <text x="60" y="117" font-size="12.5" fill="#334155">status.loadBalancer.ingress ← the VIP</text>

  <!-- Controller -->
  <rect x="490" y="44" width="370" height="86" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="2.5"/>
  <text x="510" y="74" font-size="15" font-weight="bold" fill="#9a3412">controller</text>
  <text x="510" y="97" font-size="12.5" fill="#334155">Deployment, 1 replica, leader-elected</text>
  <text x="510" y="117" font-size="12.5" fill="#334155">allocates an IP, writes it into the Service</text>

  <line x1="380" y1="70" x2="490" y2="70" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="435" y="62" text-anchor="middle" font-size="11.5" fill="#475569">watch</text>
  <line x1="490" y1="106" x2="380" y2="106" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="435" y="122" text-anchor="middle" font-size="11.5" fill="#475569">status</text>

  <!-- CRs -->
  <rect x="490" y="164" width="370" height="150" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="510" y="190" font-size="14" font-weight="bold" fill="#0f172a">Your custom resources</text>
  <rect x="508" y="202" width="160" height="26" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="516" y="220" font-size="12" fill="#334155">IPAddressPool</text>
  <text x="676" y="220" font-size="11.5" fill="#64748b">which IPs</text>
  <rect x="508" y="234" width="160" height="26" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="516" y="252" font-size="12" fill="#334155">L2Advertisement</text>
  <text x="676" y="252" font-size="11.5" fill="#64748b">L2: which nodes announce</text>
  <rect x="508" y="266" width="160" height="26" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="516" y="284" font-size="12" fill="#334155">BGPPeer</text>
  <text x="676" y="284" font-size="11.5" fill="#64748b">BGP: who to talk to</text>
  <rect x="508" y="298" width="160" height="26" rx="5" fill="#ffffff" stroke="#94a3b8"/>
  <text x="516" y="316" font-size="12" fill="#334155">BGPAdvertisement</text>
  <text x="676" y="316" font-size="11.5" fill="#64748b">BGP: what to advertise</text>

  <line x1="600" y1="164" x2="600" y2="132" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="600" y1="314" x2="600" y2="400" stroke="#64748b" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- Service -> pool -->
  <rect x="40" y="164" width="340" height="150" rx="12" fill="#eef4ff" stroke="#3b82f6" stroke-width="2"/>
  <text x="60" y="190" font-size="14" font-weight="bold" fill="#1e3a8a">The contract</text>
  <text x="60" y="216" font-size="12.5" fill="#334155">• no cloud controller on bare metal</text>
  <text x="60" y="238" font-size="12.5" fill="#334155">• nobody fills in status → &lt;pending&gt;</text>
  <text x="60" y="260" font-size="12.5" fill="#334155">• kube-proxy only programs DNAT once</text>
  <text x="60" y="282" font-size="12.5" fill="#334155">  an IP exists in status</text>
  <text x="60" y="304" font-size="12.5" fill="#166534">• MetalLB implements that controller</text>

  <!-- Speaker band -->
  <rect x="40" y="400" width="820" height="100" rx="12" fill="#f0fdf4" stroke="#22c55e" stroke-width="2.5"/>
  <text x="60" y="426" font-size="15" font-weight="bold" fill="#166534">speaker — DaemonSet, one pod per node (hostNetwork, NET_RAW/NET_ADMIN)</text>
  <rect x="60" y="438" width="245" height="46" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="182" y="458" text-anchor="middle" font-size="12.5" fill="#334155">speaker @ worker</text>
  <text x="182" y="475" text-anchor="middle" font-size="11.5" fill="#64748b">172.19.0.3</text>
  <rect x="325" y="438" width="245" height="46" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="447" y="458" text-anchor="middle" font-size="12.5" fill="#334155">speaker @ worker2</text>
  <text x="447" y="475" text-anchor="middle" font-size="11.5" fill="#64748b">172.19.0.2</text>
  <rect x="590" y="438" width="245" height="46" rx="8" fill="#ffffff" stroke="#22c55e"/>
  <text x="712" y="458" text-anchor="middle" font-size="12.5" fill="#334155">speaker @ control-plane</text>
  <text x="712" y="475" text-anchor="middle" font-size="11.5" fill="#64748b">172.19.0.4</text>

  <text x="700" y="410" text-anchor="end" font-size="12" fill="#166534">ARP/NDP replies · BGP UPDATEs → the network</text>
</svg>
