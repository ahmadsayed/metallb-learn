# Lesson 3 — the two resources that turn a pool of IPs into working VIPs.
#
# MetalLB is completely inert until you create an IPAddressPool: installing it
# gives you the machinery, not the addresses. An L2Advertisement then says
# "announce the IPs from this pool with ARP/NDP".
#
# The range below is inside the Docker bridge network that carries our kind
# cluster (172.19.0.0/16), which is what makes the VIP reachable from the host.
# It is deliberately far above Docker's sequential container addressing
# (172.19.0.2, .3, .4 …) so we never collide with a node.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lab-pool
  namespace: metallb-system
spec:
  addresses:
    - 172.19.255.200-172.19.255.250
---
apiVersion: metallb.io/v1beta1
kind: L2Advertisement
metadata:
  name: lab-l2
  namespace: metallb-system
spec:
  # No "interfaces:" and no "nodeSelectors:" on purpose: announce everywhere,
  # from every node that runs a speaker. Lesson 4 narrows this down.
  ipAddressPools:
    - lab-pool
