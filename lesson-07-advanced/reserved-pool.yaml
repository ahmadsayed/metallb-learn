# Lesson 7, recipe 1 — a pool that is NOT handed out automatically.
#
# autoAssign: false means nobody gets an address from this pool unless they ask
# for it explicitly (the metallb.io/address-pool annotation, or by pinning an
# address that lives in it). This is how you keep a block for special cases —
# ingress controllers, a database, whatever — without a random Service
# consuming it.
#
# Allocation is MetalLB's job here, exactly as in phase 1. Whether these
# addresses ever reach the network is a separate, Calico-side decision
# (recipe 4).
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lab-pool-reserved
  namespace: metallb-system
spec:
  addresses:
    - 172.19.254.10-172.19.254.19
  autoAssign: false
