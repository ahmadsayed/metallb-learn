# Lesson 7, recipe 5 — who is allowed to use a pool.
#
# serviceAllocation lets a pool declare which namespaces (or which Services, via
# serviceSelectors) may allocate from it. Combined with autoAssign: false this
# gives a pool reserved for one team that cannot be consumed by accident.
#
# namespaceSelectors / serviceSelectors accept the usual Kubernetes label
# selector shape; priority breaks ties when several pools could serve a Service.
apiVersion: v1
kind: Namespace
metadata:
  name: team-a
---
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lab-pool-team-a
  namespace: metallb-system
spec:
  addresses:
    - 172.19.254.200-172.19.254.209
  autoAssign: false
  serviceAllocation:
    namespaces:
      - team-a
---
# A small app in team-a so the VIP has endpoints to serve.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: whoami
  namespace: team-a
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whoami
  template:
    metadata:
      labels:
        app: whoami
    spec:
      containers:
        - name: whoami
          image: traefik/whoami:v1.10.2
          ports:
            - name: http
              containerPort: 80
---
# Legal: it is in team-a, asking for team-a's pool.
apiVersion: v1
kind: Service
metadata:
  name: whoami-team-a
  namespace: team-a
  annotations:
    metallb.io/address-pool: lab-pool-team-a
spec:
  type: LoadBalancer
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Illegal on purpose: same request, wrong namespace. Watch it fail with an event
# instead of silently stealing an address.
apiVersion: v1
kind: Service
metadata:
  name: whoami-thief
  annotations:
    metallb.io/address-pool: lab-pool-team-a
spec:
  type: LoadBalancer
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
