# Lesson 7, recipe 3 — decide which Services are actually advertised.
#
# A BGPAdvertisement can carry serviceSelectors (v0.16+). Only Services matching
# the selector are announced; the rest can still get an address from the pool and
# stay perfectly usable *inside* the cluster while remaining invisible to the
# network.
#
# That is the clean way to build an "internal-only" VIP, and it is also how you
# roll out gradually: label a Service to expose it, unlabel it to hide it again,
# without touching router configuration.
apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: lab-pool-public
  namespace: metallb-system
spec:
  addresses:
    - 172.19.254.100-172.19.254.109
  autoAssign: false          # only Services that explicitly ask use this pool
---
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: lab-bgp-public
  namespace: metallb-system
spec:
  ipAddressPools:
    - lab-pool-public
  communities:
    - lab-public             # from the Community CR in Lesson 6
  serviceSelectors:
    - matchLabels:
        expose: public       # ← the gate: no label, no advertisement
---
# Matches the selector: allocated AND advertised.
apiVersion: v1
kind: Service
metadata:
  name: whoami-public
  labels:
    expose: public
  annotations:
    metallb.io/address-pool: lab-pool-public
spec:
  type: LoadBalancer
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
---
# Same pool, no label: allocated but deliberately NOT advertised.
apiVersion: v1
kind: Service
metadata:
  name: whoami-private
  annotations:
    metallb.io/address-pool: lab-pool-public
spec:
  type: LoadBalancer
  selector:
    app: whoami
  ports:
    - name: http
      port: 80
      targetPort: http
