# Lesson 6 — BGP traffic engineering with the frr-k8s backend.
#
# A Community is a tag you attach to the prefixes you advertise. Routers use
# those tags to make policy decisions ("tag 64512:100 means internet-facing —
# announce it to the transit peers, and give it a high local preference").
#
# This is how you make the network do the work instead of teaching every router
# about every VIP.
#
# The Community CR declares named communities; the BGPAdvertisement then refers
# to them by name, so the same tag is reused consistently across pools.
apiVersion: metallb.io/v1beta1
kind: Community
metadata:
  name: lab-community
  namespace: metallb-system
spec:
  communities:
    - name: lab-public
      value: 64512:100
---
apiVersion: metallb.io/v1beta1
kind: BGPAdvertisement
metadata:
  name: lab-bgp
  namespace: metallb-system
spec:
  ipAddressPools:
    - lab-pool
  # Tag every prefix from lab-pool with the community above.
  communities:
    - lab-public
  # LOCAL_PREF is a *within-AS* preference. With an eBGP peer (our router is
  # AS 64513) it is not used for path selection, so it is set here to show that
  # MetalLB will happily attach it — the comment in the lesson explains when it
  # actually matters (iBGP, i.e. router and MetalLB sharing an ASN).
  localPref: 200
