# Lesson 5 — workaround for metalb/metallb#3069 (chart 0.16.1).
#
# Symptom: with `--set speaker.enabled=false`, the controller never starts:
#
#   error: pods "metallb-controller-xxx" is forbidden: User
#   "system:serviceaccount:metallb-system:metallb-controller" cannot get
#   resource "pods" in API group "" in the namespace "metallb-system"
#   msg: "unable to get own pod for owner references"
#   msg: "failed to create k8s client"
#
# Cause: the chart renders the `metallb-pod-lister` Role and RoleBinding inside
# `{{- if .Values.speaker.enabled }}`. Disable the speaker and both vanish — but
# the controller uses that Role too (its own pod for owner references, plus
# secrets, configmaps and *all* the MetalLB CRs it reads to allocate addresses).
#
# Fixed upstream by PR #3069 ("helm: fix speaker.disabled configurations"),
# merged 2026-06-10 — but the newest chart release is 0.16.1 from 2026-05-27,
# so no published version contains the fix yet. Hence this file.
#
# Apply it BEFORE the helm install, in this order:
#
#   kubectl create namespace metallb-system
#   kubectl apply -f controller-only-rbac.yaml
#   helm install metallb metallb/metallb -n metallb-system \
#     --set speaker.enabled=false --set frrk8s.enabled=false --wait
#
# Why that order: this file needs the namespace to exist, and the chart needs
# these rules to exist before its controller starts. Install first and the pod
# crash-loops, so `--wait` fails with
#   INSTALLATION FAILED: context deadline exceeded
# (a RoleBinding may reference a ServiceAccount that does not exist yet — RBAC
# does not check that, which is what makes the pre-install ordering work).
#
# Delete it once you upgrade to a chart that includes #3069 — the chart will
# then create the same objects itself (and conflict with these).
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: metallb-pod-lister
  namespace: metallb-system
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["list", "get"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["metallb.io"]
    resources: ["bfdprofiles", "bgppeers", "l2advertisements", "bgpadvertisements",
                "ipaddresspools", "communities"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: metallb-pod-lister
  namespace: metallb-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: metallb-pod-lister
subjects:
  # Upstream also binds the speaker; with the speaker disabled there is none.
  - kind: ServiceAccount
    name: metallb-controller
    namespace: metallb-system
